# Publishes the playable practice game (you + 3 AI players, runs entirely in the
# browser) to GitHub Pages every time main changes.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Online 2v2 rooms need a server, so they run on Cloudflare instead (docs/DEPLOY.md).

name: website

on:
  push:
    branches: [main]
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:demo
      - run: mkdir _site && cp demo/guandan-demo.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
